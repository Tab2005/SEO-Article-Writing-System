[tool.poetry]
name = "seo-article-writing-system"
version = "0.1.0"
description = "AI-powered SEO article writing and research platform"
authors = ["Tab2005 <tabchen2005@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# FastAPI core
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
gunicorn = "^21.2.0"

# Database
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
asyncpg = "^0.29.0"  # PostgreSQL async driver
psycopg2-binary = "^2.9.9"  # PostgreSQL sync driver (backup)

# Redis & Caching
redis = "^5.0.1"
hiredis = "^2.2.3"

# Task Queue
celery = {extras = ["redis"], version = "^5.3.4"}

# Security & Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"

# HTTP Client & Web Scraping
httpx = "^0.25.2"
beautifulsoup4 = "^4.12.2"
lxml = "^4.9.3"
playwright = "^1.40.0"  # For JS-heavy sites

# AI & LLM
openai = "^1.3.7"
tiktoken = "^0.5.2"  # Token counting

# Data Validation & Settings
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"

# Utilities
python-dotenv = "^1.0.0"
structlog = "^23.2.0"  # Better logging
tenacity = "^8.2.3"  # Retry logic
schedule = "^1.2.0"  # Task scheduling

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx-test = "^0.25.2"
factory-boy = "^3.3.0"

# Code Quality
ruff = "^0.1.6"  # Linting & formatting
mypy = "^1.7.1"  # Type checking
black = "^23.11.0"  # Code formatting (alternative to ruff format)
isort = "^5.12.0"  # Import sorting

# Development Tools
pre-commit = "^3.6.0"
ipython = "^8.17.2"
jupyter = "^1.0.0"

# Database Tools
pgcli = "^4.0.1"  # PostgreSQL CLI

[tool.poetry.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
worker = "celery -A app.tasks worker -l info"
beat = "celery -A app.tasks beat -l info"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

# Database
plugins = ["sqlalchemy.ext.mypy.plugin"]

# Third-party packages without type stubs
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "bs4.*",
    "lxml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]